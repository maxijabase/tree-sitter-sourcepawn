name: Publish release

on:
  release:
    types: [published]

env:
  EM_VERSION: 2.0.24
  EM_CACHE_FOLDER: "emsdk-cache"

jobs:
  build-wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup cache
        id: cache-system-libraries
        uses: actions/cache@v4
        with:
          path: ${{ env.EM_CACHE_FOLDER }}
          key: ${{ env.EM_VERSION }}-${{ runner.os }}
      - run: npm install
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: ${{ env.EM_VERSION }}
          actions-cache-folder: ${{ env.EM_CACHE_FOLDER }}
      - name: Build parser
        run: npm run generate
      - name: Run tests
        run: npm run test
        continue-on-error: true
      - name: Build .wasm
        run: emcc -o tree-sitter-sourcepawn.wasm -Os -s WASM=1 -I src -s SIDE_MODULE=1 -s EXPORTED_FUNCTIONS=[\"_tree_sitter_sourcepawn\"] -fno-exceptions src/parser.c src/scanner.c
      - uses: actions/upload-artifact@v4
        with:
          name: wasm
          path: tree-sitter-sourcepawn.wasm

  build-dll:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - name: Generate parser
        run: npm run generate
      - name: Build native DLL
        shell: pwsh
        run: |
          $vsPath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" `
            -latest -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath
          if (-not $vsPath) { throw "MSVC Build Tools not found" }
          $vcvars = Join-Path $vsPath "VC\Auxiliary\Build\vcvars64.bat"
          New-Item -ItemType Directory -Force -Path build-dll | Out-Null
          $cmd = @"
          call `"$vcvars`" && cd /d `"$PWD\build-dll`" && cl /nologo /c /O2 /I ..\src ..\src\parser.c ..\src\scanner.c && link /nologo /DLL /OUT:tree-sitter-sourcepawn.dll /EXPORT:tree_sitter_sourcepawn parser.obj scanner.obj
          "@
          cmd /c $cmd
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item build-dll\tree-sitter-sourcepawn.dll .
      - uses: actions/upload-artifact@v4
        with:
          name: dll
          path: tree-sitter-sourcepawn.dll

  attach-artifacts:
    needs: [build-wasm, build-dll]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: wasm
      - uses: actions/download-artifact@v4
        with:
          name: dll
      - name: Upload release assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            tree-sitter-sourcepawn.wasm \
            tree-sitter-sourcepawn.dll \
            --clobber

  publish-npm:
    needs: [attach-artifacts]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm install
      - run: npm run generate
      - uses: JS-DevTools/npm-publish@v3
        continue-on-error: true
        with:
          token: ${{ secrets.NPM_TOKEN }}

  publish-crates:
    needs: [attach-artifacts]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: katyo/publish-crates@v2
        continue-on-error: true
        with:
          registry-token: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          args: --allow-dirty
